[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpt-rag-research-core"
version = "0.1.0"
description = "Selected CPT calibration, fusion and evidence-scoring tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
include = ["cpt_core*"]
